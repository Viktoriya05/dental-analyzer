<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Выбор анализа (мультивыбор)</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f4f4f4; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        .option { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; }
        button { padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px;}
        .sheets { font-size: 14px; color: #555; margin-bottom: 15px; }
        .sheets li { margin: 2px 0; }
    </style>
</head>
<body>
<div class="card">
    <h2>Выбранные листы (<span th:text="${#lists.size(sheets)}"></span>)</h2>
    <ul class="sheets">
        <li th:each="s : ${sheets}" th:text="${s}"></li>
    </ul>

    <form action="/run-multi" method="post">
        <input type="hidden" name="sheets" th:each="s : ${sheets}" th:value="${s}">

        <div class="option"><label><input type="radio" name="analysisType" value="1" required> П.1. УЕТ на пациента</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="2"> П.2. Хирургия/Терапия</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="3"> П.3. Обращения</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="4"> П.4. Кариес K02</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="5"> П.5. Осложненный кариес K04</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="6"> П.6. Терап./хир. обращения по K04</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="7"> П.7. Ср. посещения/УЕТ при K04 (хир.)</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="8"> П.8. K10.2 (хир.) + связь с K04</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="9"> П.9. K10.3 (хир.) + связь с K04</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="10"> П.10. K04.0–K04.3 (хир.) + зубы 18/28/38/48</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="11"> П.11. Хир. обращения по диагнозам кроме K04.5–7</label></div>
        <div class="option"><label><input type="radio" name="analysisType" value="12"> П.12. Законченное лечение A16.07.002</label></div>

        <button type="submit">Запустить анализ по выбранным листам</button>
    </form>
</div>
</body>
</html>
