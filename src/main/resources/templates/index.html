<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Анализ данных</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f4f4f4; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .error { color: red; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 15px;}
        button { padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>Загрузка файлов</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" action="/upload" enctype="multipart/form-data">
        <p>Выберите один или несколько файлов .xlsx:</p>
        <input type="file" name="files" accept=".xlsx" multiple required />
        <br><br>
        <button type="submit">Загрузить</button>
    </form>
</div>
</body>
</html>
